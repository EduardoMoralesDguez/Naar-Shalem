<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naar-Shalem | Catálogo Base</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="contenedor">
    <header class="cabecera">
      <img src="img/LogoNS.png" alt="Logo del club Naar Shalem" class="logo" width="120">
      <h1>Naar-Shalem</h1>
      <p class="subtitulo">Selecciona un miembro del club</p>
    </header>

    <div class="panel-selector">
      <label for="selectorUsuario" class="etiqueta">Usuario</label>
      <select id="selectorUsuario">
        <option value="">Cargando usuarios...</option>
      </select>
      <p id="mensaje" class="mensaje" hidden></p>
    </div>

    <section id="tarjeta" class="tarjeta" hidden>
      <h2 id="tarjetaNombre"></h2>

      <dl>
        <div>
          <dt>Rol</dt>
          <dd id="tarjetaRol"></dd>
        </div>
        <div>
          <dt>Unidad</dt>
          <dd id="tarjetaUnidad"></dd>
        </div>
        <div>
          <dt>Clase</dt>
          <dd id="tarjetaClase"></dd>
        </div>
      </dl>

      <div id="dashboard" class="dashboard" hidden>
        <h3>Dashboard de progreso</h3>
        <p id="dashboardError" class="mensaje" hidden></p>

        <div id="dashboardMetricas">
          <div class="metrica">
            <div class="metrica-cabecera">
              <span>Asistencia</span>
              <strong id="asistenciaPorcentaje">0%</strong>
            </div>
            <div class="barra">
              <div id="asistenciaBarra" class="barra-relleno"></div>
            </div>
            <small id="asistenciaDetalle"></small>
          </div>

          <div class="metrica">
            <div class="metrica-cabecera">
              <span>Cumplimiento de cuotas</span>
              <strong id="cuotasPorcentaje">0%</strong>
            </div>
            <div class="barra">
              <div id="cuotasBarra" class="barra-relleno"></div>
              <span class="barra-meta" title="Meta: 70%"></span>
            </div>
            <small id="cuotasDetalle"></small>
          </div>

          <div class="total-pagado">
            <span>Total pagado en cuotas</span>
            <strong id="totalPagado">$0</strong>
          </div>
        </div>
      </div>

      <section
        id="especialidades"
        class="especialidades"
        aria-labelledby="especialidadesTitulo"
        hidden
      >
        <h3 id="especialidadesTitulo">Banda de Especialidades</h3>

        <div class="banda">
          <p
            id="especialidadesEstado"
            class="banda-estado"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          ></p>

          <ul
            id="especialidadesLista"
            class="banda-grid"
            aria-label="Especialidades obtenidas"
          ></ul>
        </div>
      </section>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
